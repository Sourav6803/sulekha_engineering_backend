openapi: 3.0.3
info:
  title: Sulekha Engineering Backend API
  description: API specification for the Sulekha Engineering backend services.
  version: 1.0.0
servers:
  - url: /api/v1
    description: Default API server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{24}$'
      description: MongoDB ObjectId string
    UsageIdParam:
      name: usageId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{24}$'
      description: MongoDB ObjectId for material usage record
  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        statusCode:
          type: integer
          example: 200
        message:
          type: string
          example: Success
        data:
          nullable: true
        timestamp:
          type: string
          format: date-time
    ApiPaginatedResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            pagination:
              type: object
              properties:
                page:
                  type: integer
                  example: 1
                limit:
                  type: integer
                  example: 20
                total:
                  type: integer
                  example: 100
                pages:
                  type: integer
                  example: 5
    User:
      type: object
      properties:
        id:
          type: string
          example: 6481a2d5b6b9a8c7e4d01234
        name:
          type: string
          example: Mohit Sharma
        email:
          type: string
          format: email
          example: mohit@example.com
        role:
          type: string
          enum: [admin, manager, warehouse_staff, installation_team, viewer]
        permissions:
          type: array
          items:
            type: string
          example: [view_customer, edit_material]
        phone:
          type: string
          example: '9876543210'
        department:
          type: string
          example: Operations
        status:
          type: string
          example: active
        lastLogin:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TokenPair:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 2
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        phone:
          type: string
          pattern: '^[0-9]{10}$'
        role:
          type: string
          enum: [admin, manager, warehouse_staff, installation_team, viewer]
        department:
          type: string
    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword, confirmPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
        confirmPassword:
          type: string
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    ResetPasswordRequest:
      type: object
      required: [token, newPassword, confirmPassword]
      properties:
        token:
          type: string
        newPassword:
          type: string
          minLength: 8
        confirmPassword:
          type: string
    Customer:
      type: object
      properties:
        id:
          type: string
        customerId:
          type: string
        name:
          type: string
        phone:
          type: string
        alternatePhone:
          type: string
        email:
          type: string
          format: email
        address:
          type: string
        city:
          type: string
        state:
          type: string
        pincode:
          type: string
        systemSizeKW:
          type: number
        roofType:
          type: string
          enum: [rcc_rooftop, tin_shed, ground_mount]
        roofArea:
          type: number
        gstNumber:
          type: string
        panNumber:
          type: string
        preferredInstallationDate:
          type: string
          format: date
        preferredTimeSlot:
          type: string
          enum: [morning, afternoon, evening, anytime]
        status:
          type: string
        notes:
          type: string
        referredBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: true
    CreateCustomerRequest:
      type: object
      required: [name, phone, address, city, state, pincode, systemSizeKW, roofType]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        phone:
          type: string
          pattern: '^[0-9]{10}$'
        alternatePhone:
          type: string
          pattern: '^[0-9]{10}$'
        email:
          type: string
          format: email
        address:
          type: string
          maxLength: 500
        city:
          type: string
        state:
          type: string
        pincode:
          type: string
          pattern: '^[0-9]{6}$'
        systemSizeKW:
          type: number
          minimum: 0.1
        roofType:
          type: string
          enum: [rcc_rooftop, tin_shed, ground_mount]
        roofArea:
          type: number
          minimum: 0
        gstNumber:
          type: string
        panNumber:
          type: string
        preferredInstallationDate:
          type: string
          format: date
        preferredTimeSlot:
          type: string
          enum: [morning, afternoon, evening, anytime]
        notes:
          type: string
          maxLength: 1000
        referredBy:
          type: string
          maxLength: 100
    UpdateCustomerRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        phone:
          type: string
          pattern: '^[0-9]{10}$'
        alternatePhone:
          type: string
          pattern: '^[0-9]{10}$'
        email:
          type: string
          format: email
        address:
          type: string
          maxLength: 500
        city:
          type: string
        state:
          type: string
        pincode:
          type: string
          pattern: '^[0-9]{6}$'
        systemSizeKW:
          type: number
          minimum: 0.1
        roofType:
          type: string
          enum: [rcc_rooftop, tin_shed, ground_mount]
        roofArea:
          type: number
          minimum: 0
        gstNumber:
          type: string
        panNumber:
          type: string
        preferredInstallationDate:
          type: string
          format: date
        preferredTimeSlot:
          type: string
          enum: [morning, afternoon, evening, anytime]
        status:
          type: string
          enum: [active, inactive, blocked, pending_verification]
        notes:
          type: string
          maxLength: 1000
        referredBy:
          type: string
          maxLength: 100
    Installation:
      type: object
      properties:
        id:
          type: string
        installationId:
          type: string
        customer:
          type: string
        customerNameSnapshot:
          type: string
        customerPhoneSnapshot:
          type: string
        projectNo:
          type: string
        quotationNo:
          type: string
        systemSizeKW:
          type: number
        roofType:
          type: string
          enum: [rcc_rooftop, tin_shed, ground_mount]
        orderDate:
          type: string
          format: date
        installDate:
          type: string
          format: date
        laborCost:
          type: number
        status:
          type: string
          enum: [pending_quotation, quoted, scheduled, in_progress, completed, cancelled]
        suggestedMaterials:
          type: array
          items:
            type: object
        loadAnalysisDetails:
          type: object
        totalLoad:
          type: number
        inverterCapacity:
          type: number
        canRunSubmersible:
          type: boolean
        notes:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: true
    CreateInstallationRequest:
      type: object
      required: [customer, systemSizeKW, roofType, installDate]
      properties:
        customer:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
        projectNo:
          type: string
          maxLength: 50
        quotationNo:
          type: string
          maxLength: 50
        systemSizeKW:
          type: number
          minimum: 0.1
        roofType:
          type: string
          enum: [rcc_rooftop, tin_shed, ground_mount]
        orderDate:
          type: string
          format: date
        installDate:
          type: string
          format: date
        laborCost:
          type: number
          minimum: 0
        notes:
          type: string
          maxLength: 1000
    UpdateInstallationRequest:
      type: object
      properties:
        customer:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
        projectNo:
          type: string
          maxLength: 50
        quotationNo:
          type: string
          maxLength: 50
        systemSizeKW:
          type: number
          minimum: 0.1
        roofType:
          type: string
          enum: [rcc_rooftop, tin_shed, ground_mount]
        orderDate:
          type: string
          format: date
        installDate:
          type: string
          format: date
        laborCost:
          type: number
          minimum: 0
        notes:
          type: string
          maxLength: 1000
        status:
          type: string
          enum: [pending_quotation, quoted, scheduled, in_progress, completed, cancelled]
    AssignMaterialsRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [material, qty]
            properties:
              material:
                type: string
                pattern: '^[0-9a-fA-F]{24}$'
              qty:
                type: number
                minimum: 0.001
              remark:
                type: string
                maxLength: 500
        idempotencyKey:
          type: string
          format: uuid
    ReverseMaterialRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          maxLength: 500
    UpdateInstallationStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending_quotation, quoted, scheduled, in_progress, completed, cancelled]
        notes:
          type: string
          maxLength: 500
    Material:
      type: object
      properties:
        id:
          type: string
        materialCode:
          type: string
        name:
          type: string
        category:
          type: string
        subCategory:
          type: string
        unit:
          type: string
        unitCost:
          type: number
        currentStock:
          type: number
        minimumStockLevel:
          type: number
        maximumStockLevel:
          type: number
        preferredSupplier:
          type: object
        alternateSuppliers:
          type: array
          items:
            type: object
        specifications:
          type: object
        description:
          type: string
        isConsumable:
          type: boolean
        status:
          type: string
        images:
          type: array
          items:
            type: object
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: true
    CreateMaterialRequest:
      type: object
      required: [name, category, unit]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        category:
          type: string
        subCategory:
          type: string
          maxLength: 50
        unit:
          type: string
          enum: [nos, mtr, kg, packet, pair, bag, roll, box]
        unitCost:
          type: number
          minimum: 0
        currentStock:
          type: number
          minimum: 0
        minimumStockLevel:
          type: number
          minimum: 0
        maximumStockLevel:
          type: number
          minimum: 0
        preferredSupplier:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
        alternateSuppliers:
          type: array
          items:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
        specifications:
          type: object
        description:
          type: string
          maxLength: 1000
        isConsumable:
          type: boolean
    UpdateMaterialRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        category:
          type: string
        subCategory:
          type: string
          maxLength: 50
        unit:
          type: string
          enum: [nos, mtr, kg, packet, pair, bag, roll, box]
        unitCost:
          type: number
          minimum: 0
        minimumStockLevel:
          type: number
          minimum: 0
        maximumStockLevel:
          type: number
          minimum: 0
        preferredSupplier:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
        alternateSuppliers:
          type: array
          items:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
        specifications:
          type: object
        description:
          type: string
          maxLength: 1000
        isConsumable:
          type: boolean
        status:
          type: string
          enum: [active, inactive, discontinued]
    AdjustStockRequest:
      type: object
      required: [adjustment, reason]
      properties:
        adjustment:
          type: number
        reason:
          type: string
          maxLength: 500
    PurchaseItem:
      type: object
      required: [material, qty, unitCost]
      properties:
        material:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
        qty:
          type: number
          minimum: 0.001
        unitCost:
          type: number
          minimum: 0
        discount:
          type: number
          minimum: 0
    Purchase:
      type: object
      properties:
        id:
          type: string
        purchaseId:
          type: string
        supplier:
          type: object
        purchaseDate:
          type: string
          format: date
        invoiceNumber:
          type: string
        purchaseOrderNumber:
          type: string
        discount:
          type: number
        tax:
          type: number
        paymentStatus:
          type: string
        paymentMethod:
          type: string
        deliveryMethod:
          type: string
        courierDetails:
          type: object
        items:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseItem'
        notes:
          type: string
        status:
          type: string
        invoiceFileUrl:
          type: string
      additionalProperties: true
    CreatePurchaseRequest:
      type: object
      required: [supplier, deliveryMethod, items]
      properties:
        supplier:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
        purchaseDate:
          type: string
          format: date
        invoiceNumber:
          type: string
          maxLength: 50
        purchaseOrderNumber:
          type: string
          maxLength: 50
        discount:
          type: number
          minimum: 0
        tax:
          type: number
          minimum: 0
        paymentStatus:
          type: string
          enum: [pending, partial, completed]
        paymentMethod:
          type: string
          enum: [cash, bank_transfer, cheque, upi, online]
        deliveryMethod:
          type: string
          enum: [pickup, courier, delivery, self_delivery]
        courierDetails:
          type: object
          properties:
            courierName:
              type: string
            trackingId:
              type: string
            expectedDate:
              type: string
              format: date
            deliveredDate:
              type: string
              format: date
        items:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseItem'
        notes:
          type: string
        idempotencyKey:
          type: string
          format: uuid
    UpdatePurchaseRequest:
      type: object
      properties:
        supplier:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
        purchaseDate:
          type: string
          format: date
        invoiceNumber:
          type: string
          maxLength: 50
        purchaseOrderNumber:
          type: string
          maxLength: 50
        discount:
          type: number
          minimum: 0
        tax:
          type: number
          minimum: 0
        paymentStatus:
          type: string
          enum: [pending, partial, completed]
        paymentMethod:
          type: string
          enum: [cash, bank_transfer, cheque, upi, online]
        deliveryMethod:
          type: string
          enum: [pickup, courier, delivery, self_delivery]
        courierDetails:
          type: object
          properties:
            courierName:
              type: string
            trackingId:
              type: string
            expectedDate:
              type: string
              format: date
            deliveredDate:
              type: string
              format: date
        items:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseItem'
        notes:
          type: string
        status:
          type: string
          enum: [pending, processing, completed, cancelled]
    Supplier:
      type: object
      properties:
        id:
          type: string
        supplierId:
          type: string
        name:
          type: string
        phone:
          type: string
        alternatePhone:
          type: string
        email:
          type: string
          format: email
        website:
          type: string
          format: uri
        address:
          type: string
        city:
          type: string
        state:
          type: string
        pincode:
          type: string
        gstNumber:
          type: string
        panNumber:
          type: string
        businessType:
          type: string
        categories:
          type: array
          items:
            type: string
        bankDetails:
          type: object
        paymentTerms:
          type: string
        creditLimit:
          type: number
        status:
          type: string
        notes:
          type: string
        averageDeliveryDays:
          type: number
        qualityRating:
          type: number
      additionalProperties: true
    CreateSupplierRequest:
      type: object
      required: [name, phone, address, city, state, pincode, categories]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        phone:
          type: string
          pattern: '^[0-9]{10}$'
        alternatePhone:
          type: string
          pattern: '^[0-9]{10}$'
        email:
          type: string
          format: email
        website:
          type: string
          format: uri
        address:
          type: string
        city:
          type: string
        state:
          type: string
        pincode:
          type: string
          pattern: '^[0-9]{6}$'
        gstNumber:
          type: string
        panNumber:
          type: string
        businessType:
          type: string
          enum: [manufacturer, distributor, wholesaler, retailer, importer]
        categories:
          type: array
          minItems: 1
          items:
            type: string
        bankDetails:
          type: object
        paymentTerms:
          type: string
          enum: [advance, credit_7_days, credit_15_days, credit_30_days, credit_45_days]
        creditLimit:
          type: number
          minimum: 0
        notes:
          type: string
          maxLength: 1000
    UpdateSupplierRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        phone:
          type: string
          pattern: '^[0-9]{10}$'
        alternatePhone:
          type: string
          pattern: '^[0-9]{10}$'
        email:
          type: string
          format: email
        website:
          type: string
          format: uri
        address:
          type: string
        city:
          type: string
        state:
          type: string
        pincode:
          type: string
          pattern: '^[0-9]{6}$'
        gstNumber:
          type: string
        panNumber:
          type: string
        businessType:
          type: string
          enum: [manufacturer, distributor, wholesaler, retailer, importer]
        categories:
          type: array
          items:
            type: string
        bankDetails:
          type: object
        paymentTerms:
          type: string
          enum: [advance, credit_7_days, credit_15_days, credit_30_days, credit_45_days]
        creditLimit:
          type: number
          minimum: 0
        averageDeliveryDays:
          type: integer
          minimum: 0
        qualityRating:
          type: number
          minimum: 0
          maximum: 5
        status:
          type: string
          enum: [active, inactive, suspended, blacklisted]
        notes:
          type: string
          maxLength: 1000
    Notification:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        message:
          type: string
        type:
          type: string
        isRead:
          type: boolean
        material:
          type: object
        createdAt:
          type: string
          format: date-time
      additionalProperties: true
    SuggestedBOMResponse:
      type: object
      properties:
        roofType:
          type: string
          enum: [rcc_rooftop, tin_shed, ground_mount]
        systemSizeKW:
          type: number
        materials:
          type: array
          items:
            type: object
    BOMTemplate:
      type: object
      properties:
        id:
          type: string
        templateName:
          type: string
        roofType:
          type: string
          enum: [rcc_rooftop, tin_shed, ground_mount]
        systemSizeKW:
          type: number
        section:
          type: string
        sectionOrder:
          type: integer
        material:
          type: object
        qtyFormula:
          type: object
        isOptional:
          type: boolean
        defaultRemark:
          type: string
        wastageFactor:
          type: number
        priority:
          type: integer
        isActive:
          type: boolean
      additionalProperties: true
    CreateBOMTemplateRequest:
      type: object
      required: [templateName, roofType, systemSizeKW, section, material, qtyFormula]
      properties:
        templateName:
          type: string
          minLength: 2
          maxLength: 100
        roofType:
          type: string
          enum: [rcc_rooftop, tin_shed, ground_mount]
        systemSizeKW:
          type: number
          minimum: 0.1
        section:
          type: string
        sectionOrder:
          type: integer
          minimum: 0
        material:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
        qtyFormula:
          type: object
          required:
            - type
            - value
          properties:
            type:
              type: string
              enum: [fixed, per_kw, linear, step]
            value:
              type: number
            minQty:
              type: number
              minimum: 0
            maxQty:
              type: number
              minimum: 0
            stepSizes:
              type: array
              items:
                type: object
                required: [fromKW, toKW, qty]
                properties:
                  fromKW:
                    type: number
                  toKW:
                    type: number
                  qty:
                    type: number
        isOptional:
          type: boolean
        defaultRemark:
          type: string
          maxLength: 500
        wastageFactor:
          type: number
          minimum: 0
          maximum: 100
        priority:
          type: integer
          minimum: 1
    UpdateBOMTemplateRequest:
      type: object
      properties:
        templateName:
          type: string
          minLength: 2
          maxLength: 100
        roofType:
          type: string
          enum: [rcc_rooftop, tin_shed, ground_mount]
        systemSizeKW:
          type: number
          minimum: 0.1
        section:
          type: string
        sectionOrder:
          type: integer
          minimum: 0
        material:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
        qtyFormula:
          type: object
          properties:
            type:
              type: string
              enum: [fixed, per_kw, linear, step]
            value:
              type: number
            minQty:
              type: number
              minimum: 0
            maxQty:
              type: number
              minimum: 0
            stepSizes:
              type: array
              items:
                type: object
                required: [fromKW, toKW, qty]
                properties:
                  fromKW:
                    type: number
                  toKW:
                    type: number
                  qty:
                    type: number
        isOptional:
          type: boolean
        defaultRemark:
          type: string
          maxLength: 500
        wastageFactor:
          type: number
          minimum: 0
          maximum: 100
        priority:
          type: integer
          minimum: 1
        isActive:
          type: boolean
    BulkCreateBOMTemplatesRequest:
      type: object
      required: [templates]
      properties:
        templates:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CreateBOMTemplateRequest'
    NotificationListQuery:
      type: object
      properties:
        page:
